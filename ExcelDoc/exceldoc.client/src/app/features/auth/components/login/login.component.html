<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Entrar</mat-card-title>
      <mat-card-subtitle>Acesse a plataforma com suas credenciais do SAP Business One.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="feedback feedback--error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <div class="feedback feedback--error" *ngIf="basesErrorMessage">
        <span>{{ basesErrorMessage }}</span>
        <button mat-button type="button" (click)="retryLoadBases()" [disabled]="isLoadingBases">
          Tentar novamente
        </button>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Base SAP Business One</mat-label>
          <mat-select
            name="database"
            [(ngModel)]="database"
            [disabled]="isLoadingBases || !bases.length"
            required>
            <mat-option *ngFor="let base of bases" [value]="base.database">
              {{ base.description ? (base.description + ' (' + base.database + ')') : base.database }}
            </mat-option>
          </mat-select>
          <mat-hint *ngIf="isLoadingBases">Carregando bases...</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuário SAP</mat-label>
          <input
            matInput
            type="text"
            name="login"
            [(ngModel)]="login"
            placeholder="Digite seu usuário do SAP Business One"
            autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            name="senha"
            [(ngModel)]="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password" />
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width login-btn"
          [disabled]="isSubmitting || isLoadingBases || !bases.length">
          <mat-spinner *ngIf="isSubmitting" diameter="20" class="spinner-inline"></mat-spinner>
          <span>{{ isSubmitting ? 'Entrando...' : 'Entrar' }}</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
