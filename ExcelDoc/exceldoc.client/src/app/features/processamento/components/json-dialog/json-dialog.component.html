<h2 mat-dialog-title>
  <span class="dialog-title__icon"><mat-icon>data_object</mat-icon></span>
  JSON — {{ 'processamento.jsonDialog.line' | translate }} {{ data.linhaExcel }}
</h2>

<mat-dialog-content>
  <h4>{{ 'processamento.jsonDialog.sentJson' | translate }}</h4>
  <pre class="json-block">{{ formattedEnviado }}</pre>

  <h4>{{ 'processamento.jsonDialog.returnJson' | translate }}</h4>
  <pre class="json-block">{{ formattedRetorno }}</pre>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close>{{ 'processamento.jsonDialog.close' | translate }}</button>
</mat-dialog-actions>
